<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#25213d" />
    <meta
      name="description"
      content="欢迎来 Lozic 的 Mac 坐一会儿。听一首歌，翻翻生活，再留下一句话。"
    />
    <title>Lozic 的 Mac</title>
    <link rel="icon" href="assets/icons/finder.png" />
    <link rel="stylesheet" href="styles/desktop.css" />
    <link rel="stylesheet" href="styles/apps.css" />
    <link rel="stylesheet" href="styles/tools.css" />
    <link rel="stylesheet" href="styles/life.css" />
  </head>
  <body>
    <main id="desktop" aria-label="Lozic 的 Mac 桌面">
      <div id="wallpaper" aria-hidden="true"></div>
      <header id="menubar" aria-label="系统菜单栏"></header>
      <section id="widgets" aria-label="桌面小组件"></section>
      <section id="desktop-files" aria-label="桌面文件"></section>
      <section id="windows" aria-label="应用窗口"></section>
      <nav id="dock" aria-label="Dock 应用程序"></nav>
    </main>
    <div id="panels"></div>
    <div id="menus"></div>
    <div id="dialogs"></div>
    <div id="toasts" role="status" aria-live="polite"></div>
    <noscript>这台小小的 Mac 需要 JavaScript 才能打开应用。</noscript>
    <audio id="audio-player" preload="metadata" aria-hidden="true"></audio>
    <script type="module" src="scripts/main.js"></script>
  </body>
</html>
